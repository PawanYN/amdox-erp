name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.1.4'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amdox/db run build
      - run: pnpm --filter api exec tsc --noEmit
      - run: pnpm --filter web exec tsc --noEmit

  unit-tests:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amdox/db run build
      - run: pnpm --filter api run test

  tenant-scoping-audit:
    name: Tenant-scoping audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Block missing tenantId filters / raw PrismaClient usage
        run: pnpm --filter api run audit:tenant-scoping

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-scan:
    name: Dependency scan (Grype)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    # Grype (free/OSS, Apache 2.0) replaces Snyk — no account/token/signup
    # required, so this actually runs on every push instead of silently
    # skipping (Snyk needs a SNYK_TOKEN repo secret that was never set,
    # so it never scanned anything). See docs/Amdox_Free_Alternatives.pdf.
    steps:
      - uses: actions/checkout@v4
      - name: Run Grype
        id: grype
        uses: anchore/scan-action@v7
        with:
          path: '.'
          fail-build: true
          severity-cutoff: high
          only-fixed: true
          cache-db: true
      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always() && steps.grype.outputs.sarif != ''
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-dependencies

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (deps + misconfig across the whole repo)
        # upstream retagged with a v-prefix; the old bare 0.24.0 tag 404s now
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # Builds each production image and scans the result with Trivy. Unlike the
  # filesystem scan above (which only sees lockfiles/config in the repo), this
  # catches CVEs in the base-image OS packages and anything else that only
  # exists inside the built image.
  image-scan:
    name: Image scan (Trivy) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: infra/docker/Dockerfile.api
            context: .
          - service: web
            dockerfile: infra/docker/Dockerfile.web
            context: .
          - service: ml-service
            dockerfile: apps/ml-service/Dockerfile
            context: apps/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: amdox-${{ matrix.service }}:ci
          push: false
          load: true
          # always re-pull base images so Debian/distroless security patches
          # are picked up instead of scanning a stale cached base
          pull: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Trivy image scan (${{ matrix.service }})
        # upstream retagged with a v-prefix; the old bare 0.24.0 tag 404s now
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: amdox-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          # distroless/Debian bases always carry a tail of will_not_fix CVEs
          # nobody can act on; fail only on findings that have a patch
          ignore-unfixed: true
          # time-boxed ignores for CVEs blocked on upstream image rebuilds —
          # every entry carries an exp: date, see the file's header comment
          trivyignores: .trivyignore

  # One Slack message per pipeline run, success or failure. Plain curl
  # against the incoming-webhook URL (repo secret SLACK_WEBHOOK_URL) rather
  # than a marketplace action — one less third-party step to trust.
  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        unit-tests,
        tenant-scoping-audit,
        build,
        secret-scan,
        dependency-scan,
        container-scan,
        image-scan,
      ]
    # always(): report failures too — a notify job that only runs on green
    # would be silent exactly when someone needs to look
    if: always()
    steps:
      - name: Post pipeline result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # Forked PRs don't receive secrets — skip quietly instead of failing
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not available — skipping notification"
            exit 0
          fi
          if printf '%s' "$RESULTS" | grep -qE 'failure|cancelled'; then
            STATUS="❌ CI failed"
          else
            STATUS="✅ CI passed"
          fi
          payload=$(printf '{"text":"%s — `%s` @ %.7s (<%s|view run>)"}' \
            "$STATUS" "$REF" "$SHA" "$RUN_URL")
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL"
