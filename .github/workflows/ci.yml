name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '9.1.4'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @amdox/db run build
      - run: pnpm --filter api exec tsc --noEmit
      - run: pnpm --filter web exec tsc --noEmit

  tenant-scoping-audit:
    name: Tenant-scoping audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Block missing tenantId filters / raw PrismaClient usage
        run: pnpm --filter api run audit:tenant-scoping

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  secret-scan:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  dependency-scan:
    name: Dependency scan (Snyk)
    runs-on: ubuntu-latest
    # Requires a SNYK_TOKEN repo secret (Settings -> Secrets and variables -> Actions).
    # Skips cleanly instead of failing the pipeline when it isn't configured yet.
    steps:
      - uses: actions/checkout@v4
      - name: Check for SNYK_TOKEN
        id: check-token
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SNYK_TOKEN secret not set — skipping Snyk dependency scan. Add it under Settings > Secrets and variables > Actions to enable."
          fi
      - name: Run Snyk
        if: steps.check-token.outputs.has_token == 'true'
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --all-projects --severity-threshold=high

  container-scan:
    name: Container scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan (deps + misconfig across the whole repo)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'

  # Builds each production image and scans the result with Trivy. Unlike the
  # filesystem scan above (which only sees lockfiles/config in the repo), this
  # catches CVEs in the base-image OS packages and anything else that only
  # exists inside the built image.
  image-scan:
    name: Image scan (Trivy) — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            dockerfile: infra/docker/Dockerfile.api
            context: .
          - service: web
            dockerfile: infra/docker/Dockerfile.web
            context: .
          - service: ml-service
            dockerfile: apps/ml-service/Dockerfile
            context: apps/ml-service
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: amdox-${{ matrix.service }}:ci
          push: false
          load: true
          # always re-pull base images so Debian/distroless security patches
          # are picked up instead of scanning a stale cached base
          pull: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - name: Trivy image scan (${{ matrix.service }})
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: amdox-${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          # distroless/Debian bases always carry a tail of will_not_fix CVEs
          # nobody can act on; fail only on findings that have a patch
          ignore-unfixed: true
          # time-boxed ignores for CVEs blocked on upstream image rebuilds —
          # every entry carries an exp: date, see the file's header comment
          trivyignores: .trivyignore

  # One Slack message per pipeline run, success or failure. Plain curl
  # against the incoming-webhook URL (repo secret SLACK_WEBHOOK_URL) rather
  # than a marketplace action — one less third-party step to trust.
  notify:
    name: Slack notification
    runs-on: ubuntu-latest
    needs:
      [
        lint,
        typecheck,
        tenant-scoping-audit,
        build,
        secret-scan,
        dependency-scan,
        container-scan,
        image-scan,
      ]
    # always(): report failures too — a notify job that only runs on green
    # would be silent exactly when someone needs to look
    if: always()
    steps:
      - name: Post pipeline result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          # Forked PRs don't receive secrets — skip quietly instead of failing
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL not available — skipping notification"
            exit 0
          fi
          if printf '%s' "$RESULTS" | grep -qE 'failure|cancelled'; then
            STATUS="❌ CI failed"
          else
            STATUS="✅ CI passed"
          fi
          payload=$(printf '{"text":"%s — `%s` @ %.7s (<%s|view run>)"}' \
            "$STATUS" "$REF" "$SHA" "$RUN_URL")
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$SLACK_WEBHOOK_URL"
