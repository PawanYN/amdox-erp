# Dev environment overrides — installed into the amdox-dev namespace:
#   helm upgrade --install amdox infra/helm/amdox -n amdox-dev -f infra/helm/amdox/values-dev.yaml
# Only keys that differ from values.yaml belong here.

api:
  # kubeseal-encrypted secrets (strict scope: bound to secret name
  # `amdox-api-secrets` in namespace `amdox-dev` — unusable anywhere else).
  # These blobs are safe to commit; only the sealed-secrets controller in
  # the cluster can decrypt them. To rotate a value:
  #   kubectl -n amdox-dev create secret generic amdox-api-secrets \
  #     --dry-run=client --from-literal=KEY=newvalue -o yaml \
  #   | kubeseal --format yaml   # then paste the new blob here
  sealedSecrets:
    enabled: true
    encryptedData:
      BULL_BOARD_PASSWORD: 
      BULL_BOARD_USER: 
      DATABASE_URL: 
      JWT_SECRET: 
      KEYCLOAK_ADMIN_PASSWORD: 
      KEYCLOAK_ADMIN_USERNAME: 
