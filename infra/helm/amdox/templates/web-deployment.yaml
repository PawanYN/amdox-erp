# Next.js frontend — same Deployment pattern as the api. No ConfigMap or
# Secret: NEXT_PUBLIC_* config is baked into the JS bundle at image build
# time, so there is nothing to inject at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: amdox-web
  labels:
    app.kubernetes.io/name: amdox-web
    app.kubernetes.io/part-of: amdox
spec:
  # replicas omitted when the HPA owns scaling (see api-deployment.yaml)
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicas }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: amdox-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: amdox-web
        app.kubernetes.io/part-of: amdox
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image }}:{{ .Values.web.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          # No dedicated health endpoint; any HTTP response from / (200 or
          # a redirect — httpGet probes count 200–399 as success) proves the
          # server is up.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: amdox-web
  labels:
    app.kubernetes.io/name: amdox-web
    app.kubernetes.io/part-of: amdox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: amdox-web
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
