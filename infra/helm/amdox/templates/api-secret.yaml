# Secret — a ConfigMap for sensitive values. Two things differ from a
# ConfigMap: the cluster can encrypt Secrets at rest + RBAC can restrict
# reads, and tooling (kubectl describe, logs) redacts them by default.
# `stringData` (used here) takes plain strings and Kubernetes base64-encodes
# them on storage; the alternative `data` field expects you to base64 them
# yourself. NOTE: base64 is encoding, NOT encryption — a rendered Secret in
# git is a leaked secret, which is why values.yaml keeps these empty.
#
# Two modes, picked by api.sealedSecrets.enabled:
#
#  SealedSecret (per-env values files) — each value was encrypted on the
#  workstation with `kubeseal`, using the PUBLIC key of the sealed-secrets
#  controller running in the cluster. Only that controller holds the private
#  key, so the encrypted blobs are safe to commit. When this manifest lands,
#  the controller decrypts it and materialises the real `amdox-api-secrets`
#  Secret next to it. Encryption is "strict" scope: a blob is bound to the
#  secret's NAME and NAMESPACE, so dev blobs cannot be replayed in prod —
#  every environment seals its own.
#
#  Plain Secret (fallback) — for clusters without the controller; values
#  must then be supplied at install time (--set / uncommitted -f file).
{{- if .Values.api.sealedSecrets.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: amdox-api-secrets
  labels:
    app.kubernetes.io/name: amdox-api
    app.kubernetes.io/part-of: amdox
spec:
  encryptedData:
    {{- range $key, $value := .Values.api.sealedSecrets.encryptedData }}
    {{ $key }}: {{ $value }}
    {{- end }}
  # Blueprint for the Secret the controller will create from the blobs.
  template:
    metadata:
      name: amdox-api-secrets
      labels:
        app.kubernetes.io/name: amdox-api
        app.kubernetes.io/part-of: amdox
    type: Opaque
{{- else }}
apiVersion: v1
kind: Secret
metadata:
  name: amdox-api-secrets
  labels:
    app.kubernetes.io/name: amdox-api
    app.kubernetes.io/part-of: amdox
type: Opaque
stringData:
  {{- range $key, $value := .Values.api.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
