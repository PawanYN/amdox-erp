# HorizontalPodAutoscaler — watches live CPU usage (via metrics-server)
# against each pod's requests.cpu and adjusts the Deployment's replica
# count between min and max. Example: target 70% of a 100m request means
# sustained usage above ~70m per pod triggers a scale-out.
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amdox-api
  labels:
    app.kubernetes.io/name: amdox-api
    app.kubernetes.io/part-of: amdox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: amdox-api
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.web.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: amdox-web
  labels:
    app.kubernetes.io/name: amdox-web
    app.kubernetes.io/part-of: amdox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: amdox-web
  minReplicas: {{ .Values.web.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.web.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.web.autoscaling.targetCPUUtilizationPercentage }}
{{- end }}
