# Staging environment overrides — installed into the amdox-staging namespace:
#   helm upgrade --install amdox infra/helm/amdox -n amdox-staging -f infra/helm/amdox/values-staging.yaml
# Same topology as dev but its OWN namespace, database, Keycloak and secrets —
# nothing is shared with dev/prod. Service DNS is namespace-scoped: this
# api's `amdox-postgres` resolves to amdox-postgres.amdox-staging, never dev's.

ingress:
  webHost: app-staging.amdox.local
  apiHost: api-staging.amdox.local

# Staging is the canary proving ground: the namespace is labeled
# istio-injection=enabled, so every pod carries an Envoy sidecar and the
# VirtualService's 90/10 split is enforced on calls to amdox-api.
istio:
  enabled: true
  canary:
    enabled: true
    tag: ci # same image for the demo; a real canary points at the new tag
    weight: 10

api:
  config:
    FRONTEND_URL: http://app-staging.amdox.local
  # Sealed for namespace amdox-staging — dev/prod blobs are useless here
  # (kubeseal strict scope), so every environment carries its own.
  sealedSecrets:
    enabled: true
    encryptedData:
      BULL_BOARD_PASSWORD: 
      BULL_BOARD_USER: 
      DATABASE_URL: 
      JWT_SECRET: 
      KEYCLOAK_ADMIN_PASSWORD: 
      KEYCLOAK_ADMIN_USERNAME: 
