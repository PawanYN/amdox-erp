# Prod environment overrides — installed into the amdox-prod namespace:
#   helm upgrade --install amdox infra/helm/amdox -n amdox-prod -f infra/helm/amdox/values-prod.yaml
# On the local kind cluster this is a prod SIMULATION: devDependencies stays
# enabled (in-cluster Postgres/Keycloak) and images are side-loaded. A real
# prod cluster overrides devDependencies.enabled=false, points the config at
# managed services, sets imagePullPolicy: IfNotPresent + a registry image,
# and re-seals secrets against that cluster's own controller.

ingress:
  webHost: app-prod.amdox.local
  apiHost: api-prod.amdox.local

api:
  config:
    FRONTEND_URL: http://app-prod.amdox.local
    # Bumped 600 → 900 via a git commit as the Day 24 GitOps proof: ArgoCD
    # saw the commit and rolled the ConfigMap with no kubectl/helm run.
    THROTTLE_MEDIUM_LIMIT: "900"
  # 2 always-on api pods: HPA can never scale below this, and it makes the
  # PDB (minAvailable: 1) meaningful — a node drain may evict one api pod
  # but never both at once.
  autoscaling:
    minReplicas: 2
    maxReplicas: 6
  sealedSecrets:
    enabled: true
    encryptedData:
      BULL_BOARD_PASSWORD: 
      BULL_BOARD_USER: 
      DATABASE_URL: 
      JWT_SECRET: 
      KEYCLOAK_ADMIN_PASSWORD: 
      KEYCLOAK_ADMIN_USERNAME: 

web:
  autoscaling:
    minReplicas: 2
