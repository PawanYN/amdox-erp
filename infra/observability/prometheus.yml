global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # The NestJS API's OTel Prometheus exporter (pm2 on the host)
  - job_name: amdox-api
    static_configs:
      - targets: ['host.docker.internal:9464']

  # Host saturation: CPU, memory, disk, network
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # The collector's own health (spans received/exported, sampling decisions)
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
